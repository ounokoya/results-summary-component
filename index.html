<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
    <title>Frontend Mentor | Results summary component</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <main>
      <section aria-labelledby="result-title" class="flex h-[22.25rem] flex-col items-center rounded-b-card bg-linear-to-b from-light-slate-blue to-light-royal-blue pt-6 text-center shadow-card">
        <h1 id="result-title" class="font-bold text-your-result">Your Result</h1>
        <p class="mt-[1.4375rem] flex size-[8.75rem] flex-col items-center rounded-full bg-linear-to-b from-violet-blue to-persian-blue pt-9">
          <span class="text-score font-extrabold text-white">76</span>
          <span class="mt-[0.4375rem] text-small text-light-lavender">of 100</span>
        </p>
        <h2 class="mt-6 text-heading font-bold text-white">Great</h2>
        <p class="mt-2 w-[16.3125rem] text-small/[1.375] text-light-lavender">You scored higher than 65% of the people who have taken these tests.</p>
      </section>

      <section aria-labelledby="summary-title" class="px-[1.875rem] pt-6 pb-[1.875rem]">
        <h2 id="summary-title" class="font-bold">Summary</h2>
        <ul aria-labelledby="summary-title" class="mt-[1.4375rem] space-y-4 text-small">
          <li class="flex h-14 items-center gap-3 rounded-row bg-light-red/5 px-4">
            <img src="./assets/images/icon-reaction.svg" alt="" width="20" height="20">
            <span class="text-reaction-text">Reaction</span>
            <span class="ml-auto font-bold"><span>80</span> <span class="text-out-of">/ 100</span></span>
          </li>
          <li class="flex h-14 items-center gap-3 rounded-row bg-orangey-yellow/5 px-4">
            <img src="./assets/images/icon-memory.svg" alt="" width="20" height="20">
            <span class="text-memory-text">Memory</span>
            <span class="ml-auto font-bold"><span>92</span> <span class="text-out-of">/ 100</span></span>
          </li>
          <li class="flex h-14 items-center gap-3 rounded-row bg-green-teal/5 px-4">
            <img src="./assets/images/icon-verbal.svg" alt="" width="20" height="20">
            <span class="text-verbal-text">Verbal</span>
            <span class="ml-auto font-bold"><span>61</span> <span class="text-out-of">/ 100</span></span>
          </li>
          <li class="flex h-14 items-center gap-3 rounded-row bg-cobalt-blue/5 px-4">
            <img src="./assets/images/icon-visual.svg" alt="" width="20" height="20">
            <span class="text-cobalt-blue">Visual</span>
            <span class="ml-auto font-bold"><span>72</span> <span class="text-out-of">/ 100</span></span>
          </li>
        </ul>
        <button type="button" class="mt-[1.5625rem] h-14 w-full cursor-pointer rounded-full bg-dark-gray-blue font-bold text-white">Continue</button>
      </section>
    </main>

    <footer class="py-4 text-center text-attribution">
      Challenge by <a class="text-link underline" href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a class="text-link underline" href="https://www.frontendmentor.io/profile/ounokoya">Koya Esdras</a>.
    </footer>
  </body>
</html>
