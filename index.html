<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
    <title>Frontend Mentor | Results summary component</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <main>
      <section aria-labelledby="result-title">
        <h1 id="result-title">Your Result</h1>
        <p>
          <span>76</span>
          <span>of 100</span>
        </p>
        <h2>Great</h2>
        <p>You scored higher than 65% of the people who have taken these tests.</p>
      </section>

      <section aria-labelledby="summary-title">
        <h2 id="summary-title">Summary</h2>
        <ul aria-labelledby="summary-title">
          <li>
            <img src="./assets/images/icon-reaction.svg" alt="" width="20" height="20">
            <span>Reaction</span>
            <span><span>80</span> <span>/ 100</span></span>
          </li>
          <li>
            <img src="./assets/images/icon-memory.svg" alt="" width="20" height="20">
            <span>Memory</span>
            <span><span>92</span> <span>/ 100</span></span>
          </li>
          <li>
            <img src="./assets/images/icon-verbal.svg" alt="" width="20" height="20">
            <span>Verbal</span>
            <span><span>61</span> <span>/ 100</span></span>
          </li>
          <li>
            <img src="./assets/images/icon-visual.svg" alt="" width="20" height="20">
            <span>Visual</span>
            <span><span>72</span> <span>/ 100</span></span>
          </li>
        </ul>
        <button type="button">Continue</button>
      </section>
    </main>

    <footer>
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="https://www.frontendmentor.io/profile/ounokoya">Koya Esdras</a>.
    </footer>
  </body>
</html>
