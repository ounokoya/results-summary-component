<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
    <title>Frontend Mentor | Results summary component</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body class="md:grid md:min-h-dvh md:grid-rows-[1fr_auto_1fr] md:bg-pale-blue">
    <main class="md:row-start-2 md:mx-auto md:grid md:w-[46rem] md:grid-cols-2 md:rounded-card md:bg-white md:shadow-card">
      <section aria-labelledby="result-title" class="flex h-[22.25rem] flex-col items-center rounded-b-card bg-linear-to-b from-light-slate-blue to-light-royal-blue pt-6 text-center shadow-card md:h-auto md:rounded-card md:pt-[2.375rem] md:shadow-none">
        <h1 id="result-title" class="font-bold text-your-result md:text-heading">Your Result</h1>
        <p class="mt-[1.4375rem] flex size-[8.75rem] flex-col items-center rounded-full bg-linear-to-b from-violet-blue to-persian-blue pt-9 md:mt-[2.1875rem] md:size-[12.5rem] md:pt-14">
          <span class="text-score font-extrabold text-white md:text-score-lg">76</span>
          <span class="mt-[0.4375rem] text-small text-light-lavender md:mt-[0.1875rem] md:text-body">of 100</span>
        </p>
        <h2 class="mt-6 text-heading font-bold text-white md:mt-7 md:text-great">Great</h2>
        <p class="mt-2 w-[16.3125rem] text-small/[1.375] text-light-lavender md:mt-3.5 md:w-[15.75rem] md:text-body/[1.278]">You scored higher than 65% of the people who have taken these tests.</p>
      </section>

      <section aria-labelledby="summary-title" class="px-[1.875rem] pt-6 pb-[1.875rem] md:px-10 md:pt-[2.375rem] md:pb-[2.875rem]">
        <h2 id="summary-title" class="font-bold md:text-heading">Summary</h2>
        <ul aria-labelledby="summary-title" class="mt-[1.4375rem] space-y-4 text-small md:mt-7 md:text-body">
          <li class="flex h-14 items-center gap-3 rounded-row bg-light-red/5 px-4">
            <img src="./assets/images/icon-reaction.svg" alt="" width="20" height="20">
            <span class="text-reaction-text">Reaction</span>
            <span class="ml-auto font-bold"><span>80</span> <span class="text-out-of">/ 100</span></span>
          </li>
          <li class="flex h-14 items-center gap-3 rounded-row bg-orangey-yellow/5 px-4">
            <img src="./assets/images/icon-memory.svg" alt="" width="20" height="20">
            <span class="text-memory-text">Memory</span>
            <span class="ml-auto font-bold"><span>92</span> <span class="text-out-of">/ 100</span></span>
          </li>
          <li class="flex h-14 items-center gap-3 rounded-row bg-green-teal/5 px-4">
            <img src="./assets/images/icon-verbal.svg" alt="" width="20" height="20">
            <span class="text-verbal-text">Verbal</span>
            <span class="ml-auto font-bold"><span>61</span> <span class="text-out-of">/ 100</span></span>
          </li>
          <li class="flex h-14 items-center gap-3 rounded-row bg-cobalt-blue/5 px-4">
            <img src="./assets/images/icon-visual.svg" alt="" width="20" height="20">
            <span class="text-cobalt-blue">Visual</span>
            <span class="ml-auto font-bold"><span>72</span> <span class="text-out-of">/ 100</span></span>
          </li>
        </ul>
        <button type="button" class="mt-[1.5625rem] md:mt-[2.5625rem] h-14 w-full cursor-pointer rounded-full bg-dark-gray-blue font-bold text-white focus-ring hover:bg-linear-to-b hover:from-light-slate-blue hover:to-light-royal-blue hover:shadow-button">Continue</button>
      </section>
    </main>

    <footer class="py-4 text-center text-attribution md:row-start-3 md:self-end">
      Challenge by <a class="link focus-ring" href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a class="link focus-ring" href="https://www.frontendmentor.io/profile/ounokoya">Koya Esdras</a>.
    </footer>
  </body>
</html>
